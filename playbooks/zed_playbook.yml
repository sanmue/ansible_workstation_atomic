---

- name: Zed editor
  hosts: localhost
  connection: local
  tasks:
    - name: Zed editor - install - via homebrew (not bluefin-dx)
      when:
        - os_id != "bluefin"
      community.general.homebrew:
        name:
          - zed # Multiplayer code editor

