---

- name: Visual Studio Code
  hosts: localhost
  connection: local
  tasks:

    - name: Visual Studio Code - Check if Visual Studio Code is already available
      ansible.builtin.command:
        cmd: code --version
      register: vscode_check
      changed_when: false
      failed_when: false

    - name: Visual Studio Code - install block
      when:
        - vscode_check.rc != 0    # if failed: VS Code not available
      block:

        - name: Visual Studio Code - add ublue-os homebrew tap
          ansible.builtin.command:
            cmd: /home/linuxbrew/.linuxbrew/bin/brew tap ublue-os/tap
          register: brew_tap_ublue
          changed_when: >
            'Tapped' in (brew_tap_ublue.stdout + brew_tap_ublue.stderr)

        - name: Visual Studio Code - trust ublue-os homebrew tap
          ansible.builtin.command:
            cmd: /home/linuxbrew/.linuxbrew/bin/brew trust ublue-os/tap
          register: brew_trust_ublue
          changed_when: >
            'Trusted' in (brew_trust_ublue.stdout + brew_trust_ublue.stderr)

        - name: Visual Studio Code - install
          community.general.homebrew_cask:
            name: ublue-os/tap/visual-studio-code-linux
            state: present
            # path: /home/linuxbrew/.linuxbrew/bin
            update_homebrew: false
