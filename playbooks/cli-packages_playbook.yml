---

- name: Install cli packages
  hosts: localhost
  connection: local
  tasks:
    - name: Install cli packages - homebrew - update repository (all)
      community.general.homebrew:
        update_homebrew: true

    - name: Install cli packages - tools - via homebrew (not bluefin-dx)
      when:
        - os_id != "bluefin"    # which means for: Bluefin Dakota, Fedora Silverblue
      community.general.homebrew:
        name:
          - atuin         # Improved shell history for zsh, bash, fish and nushell
          - bat           # Cat clone with syntax highlighting and git integration
          - chezmoi       # dotfiles management across multiple machines
          - direnv        # shell extension that manages your environment
          - dysk          # Linux utility to get information on filesystems, like df but better
          - eza           # modern replacement for ls (community fork of exa)
          - fd            # Simple, fast and user-friendly alternative to find
          - gh            # GitHub command-line tool
          - glab          # Open-source GitLab command-line tool
          - podman-tui    # Podman Terminal User Interface
          - ripgrep       # Search tool like grep and The Silver Searcher
          - tealdeer      # A fast tldr client in Rust
          - trash-cli     # Command line trashcan (recycle bin) interface
          - tree          # A directory listing program displaying a depth indented list of files
          - unzip         # extracting and viewing files in .zip archives
          - yq            # Command-line YAML, XML, TOML processor - jq wrapper for YAML/XML/TOML documents
          - zoxide        # A smarter cd command for your terminal # also used with nnn
          - zsh           # A very advanced and programmable command interpreter (shell) for UNIX
        state: present

    - name: Install cli packages - tools - via homebrew (Fedora Silverblue)
      when:
        - os_id == "fedora"
        - os_variant_id == "silverblue"
      community.general.homebrew:
        name:
          - distrobox     # Use any linux distribution inside your terminal # Silverblue: toolbx
          - fzf           # Command-line fuzzy finder written in Go
          - htop          # already integrated # Interactive process viewer
          # - restic        # Fast, efficient and secure backup program
          - rclone        # Rsync for cloud storage
          - smartmontools # SMART hard drive monitoring
          - sqlite        # A C library that implements an SQL database engine
          - starship      # cross-shell prompt
          - tcpdump       # Command-line packet analyzer
          - tmux          # Terminal multiplexer
          # - ykman         # Tool for managing your YubiKey configuration
        state: present

    - name: Install cli packages - tools - via homebrew (Bluefin Dakota)
      when:
        - os_id == "bluefin-dakota"
      community.general.homebrew:
        name:
          - 7zip              # 7-Zip is a file archiver with a high compression ratio
          - mise          # The front-end to your dev env
          - uv            # Python package installer and resolver written in Rust
          - wireguard-tools   # next generation secure network tunnel - tools for configuration
        state: present

    - name: Install cli packages - tools - via homebrew (all)
      community.general.homebrew:
        name:
          - age                   # Simple, modern, secure file encryption
          # - bash-completion     # already integrated
          # - bash-color-prompt   # already integrated
          - borgbackup    # Deduplicating backup program with compression and authenticated encryption
          - clamav        # Anti-virus toolkit for Unix
          # - helix         # Post-modern modal text editor # alternative to vim
          - hugo          # static site generator
          - inxi          # full featured system information script
          - lima          # Linux Machines - Linux virtual machines with automatic file sharing and port forwarding (similar to WSL2)
          - lima-additional-guestagents    # Additional guest agents for Lima # guest agents for non-native architectures
          # - micro         # modern and intuitive terminal-based text editor # flatpak: io.github.zyedidia.micro # alternative to nano
          - nnn           # terminal file manager
          - nload         # Monitors network traffic and bandwidth usage
          - pass          # the standard unix password manager
          # - powershell    # cross-platform automation and configuration tool/framework
          #                 # Workaround for PowerShell: Docker-Container
          #                 # - <https://learn.microsoft.com/en-us/powershell/scripting/install/powershell-in-docker>
          #                 # - <https://mcr.microsoft.com/en-us/artifact/mar/powershell/about>
          - shellcheck    # Shell script analysis tool # also used in vim-ale
          - shfmt         # Format shell programs
          - stress-ng     # Software to stress test a computer system in various selectable ways
          - syncthing     # Continuous Replication / Cluster Synchronization Thing
          - wireshark     # network analyzer and capture tool - without graphical user interface # only cli (e.g. tshark, editcap, capinfos, ...)
          - zsh-autocomplete              # Real-time type-ahead completion for Zsh
          - zsh-autosuggestions           # Fish-like autosuggestions for zsh
          - zsh-completions               # Additional completion definitions for Zsh
          - zsh-syntax-highlighting       # Fish shell like syntax highlighting for Zsh
          - zsh-history-substring-search  # ZSH port of Fish history search (up arrow)
          # - zsh-you-should-use            # ZSH plugin that reminds you to use existing aliases for commands you just typed
        state: present

        # Packages already available in all OSs:
        # - cups          # already integrated # OpenPrinting CUPS - daemon package
        # - curl          # already integrated
        # - firewalld     # already integrated # Firewall daemon with D-Bus interface
        # - flatpak       # already integrated # Linux application sandboxing and distribution framework
        # - git           # already integrated # distributed version control system
        # - jq            # already integrated # Command-line JSON processor
        # - podman        # already integrated # Tool for managing OCI containers and pods
        # - rsync         # already integrated # fast and versatile file copying tool for remote and local files
        # - vim           # already integrated # Vi Improved, a highly configurable, improved version of the vi text editor
        # - vim-ale       # not available with brew # Lint Engine (plugin for vim) # Alternative: install from git repo
        # - wget          # already integrated # Network utility to retrieve files from the web
        # - zstd          # already integrated # Zstandard - Fast real-time compression algorithm
