- name: Mise - node
  hosts: localhost
  connection: local
  tasks:
    - name: Mise - node - Get latest node version
      ansible.builtin.command: mise ls-remote node --json
      register: latest_node_version_json
      changed_when: false
      no_log: true # hiding output, it is very long

    - name: Mise - node - Set latest node version
      ansible.builtin.set_fact:
        latest_node_version: "{{ (latest_node_version_json.stdout | from_json)[-1].version }}"

    - name: Mise - node - Get installed node versions
      ansible.builtin.command: mise list node --json
      register: installed_node_versions_json
      changed_when: false

    - name: Mise - node - Set installed node versions
      ansible.builtin.set_fact:
        installed_node_versions: "{{ installed_node_versions_json.stdout | from_json | json_query('[].version') }}"

    - name: Mise - node - install latest node version (env_user)
      when: latest_node_version not in installed_node_versions
      ansible.builtin.shell: >
        eval "$(mise activate bash)" && mise use --global node@{{ latest_node_version }}
      args:
        executable: /bin/bash
      register: mise_install_result
      changed_when: mise_install_result.rc == 0
      failed_when:
        - mise_install_result.rc != 0
