---

- name: Uv Python tool
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    uv_python_tools:
      - gputaskman
      - sshclick
      - cst-lsp
      - docutils
      - pip3-autoremove
      - "python-lsp-server[all]"
      - ruff
      - yamllint

  tasks:
    - name: Uv Python tool - Check if uv is available
      tags: pipuv
      ansible.builtin.command:
        cmd: uv --version
      register: uv_check
      changed_when: false
      failed_when: false

    - name: Uv Python tool - Fail when uv is not available
      tags: pipuv
      ansible.builtin.fail:
        msg: >-
          uv is not installed or not available in PATH.
          Install uv before running the uv Python tools playbook.
      when: uv_check.rc != 0

    # ansible-core + ansible-lint,ansible-navigator,ansible-creator + dependencies (jmespath,psutil) installed in start.sh
    # Ansible is initially bootstrapped in start.sh because this playbook
    # requires ansible-playbook itself. The configuration is repeated here
    # to keep the uv tool environment in the desired state.

    - name: Uv Python tool - install Python tools - Ansible
      tags: pipuv
      ansible.builtin.command:
        cmd: >-
          uv tool install
          --with-executables-from ansible-lint,ansible-navigator,ansible-creator
          --with jmespath
          --with psutil
          ansible-core
      register: uv_tool_install_ansible
      changed_when: "'Installed' in uv_tool_install_ansible.stderr"

    - name: Uv Python tool - install Python tools - Jupyter
      tags: pipuv
      ansible.builtin.command:
        cmd: >-
          uv tool install
          --with-executables-from notebook,ipython,nbconvert
          --with ipywidgets
          jupyterlab
      register: uv_tool_install_jupyter
      changed_when: "'Installed' in uv_tool_install_jupyter.stderr"

    - name: Uv Python tool - install python tools - misc
      tags: pipuv
      ansible.builtin.command:
        argv:
          - uv
          - tool
          - install
          - "{{ item }}"
      loop: "{{ uv_python_tools }}"
      register: uv_tool_install
      changed_when: "'Installed' in uv_tool_install.stderr"
    # oder: cmd: "uv tool install {{ item }}"
