---

- name: Vicinae launcher
  hosts: localhost
  connection: local
  tasks:
    - name: Vicinae launcher - download vicinae install script
      tags: upvic
      ansible.builtin.get_url:
        url: https://vicinae.com/install.sh
        dest: /tmp/vicinae-install.sh
        mode: '0755'

    - name: Vicinae launcher - execute vicinae install script
      tags: upvic
      ansible.builtin.command: bash /tmp/vicinae-install.sh --prefix {{ ansible_facts['env']['HOME'] }}/.local
      register: vicinae_install
      changed_when:
        - "'successfully installed' in vicinae_install.stdout"
        - vicinae_install.rc == 0
      failed_when: vicinae_install.rc != 0

    - name: Vicinae launcher - install required packages for extensions via brew
      community.general.homebrew:
        name:
          # muss hier bereits vorhanden sein: npm
