          # - gcc     # already integrated # for 'brotab': building psutil
          # - git     # already integrated # clone extension repo
          # - pipx    # recommended for install 'brotab' module # using 'uv tool' instead because of error message
                      # - subprocess-exited-with-error # Building wheel for psutil (pyproject.toml) did not run successfully.
                      # - error: command 'gcc-12' failed: No such file or directory ...
          # - rust    # 'Fuzzy Files' extension requires 'goldfish' # 'goldfish' does not build reliably
          # - sqlite  # already integrated # shortcut conf: via sqlite cmd
          # - uv        # for install 'brotab' module via 'uv tool' # brotab not used anymore

