# ### GNOME ----------
# - install

- name: Import GNOME Papirus icon theme playbook
  ansible.builtin.import_playbook: playbooks/gnome-papirus-icon-theme_playbook.yml
  when:
    - ansible_facts['env']['XDG_CURRENT_DESKTOP'] == "GNOME"

# - config

- name: Import GNOME configuration playbook
  ansible.builtin.import_playbook: playbooks/gnome-config_playbook.yml
  when:
    - ansible_facts['env']['XDG_CURRENT_DESKTOP'] == "GNOME"

- name: Import GNOME Ptyxis configuration playbook
  ansible.builtin.import_playbook: playbooks/gnome-ptyxis-config_playbook.yml
  when:
    - ansible_facts['env']['XDG_CURRENT_DESKTOP'] == "GNOME"
    - os_id != "bluefin-dakota" # Dakota uses ghostty

